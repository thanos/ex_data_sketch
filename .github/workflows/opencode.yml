name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # issue_comment/pull_request_review_comment always run with the base
    # repo's GITHUB_TOKEN and secrets, regardless of who posted the
    # triggering comment -- unlike pull_request, there is no fork
    # isolation here. The author_association check below is required,
    # not optional: without it, any GitHub account (including a
    # first-time, unaffiliated commenter on this public repo) can trigger
    # this job.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Pinned to a commit SHA, not @latest -- a mutable tag on a
        # third-party action combined with a secret in its environment is
        # a standing secret-exfiltration risk (the action's code can
        # change at any time with no corresponding change in this repo).
        # Bump the SHA deliberately, with review, not automatically.
        uses: anomalyco/opencode/github@284214c78d32a09fd9c729bdefc07be50f74eb40
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.1
